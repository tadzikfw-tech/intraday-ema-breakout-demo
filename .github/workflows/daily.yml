name: dzienny-bot
on:
  schedule:
    - cron: "30 21 * * 1-5"   # codziennie pon-pt 21:30 UTC (po zamknieciu sesji NY)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uruchom bota
        run: python3 bot.py
      - name: Zapisz wyniki
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "dane $(date -u +%F)" && git push)
